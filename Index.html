<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For You❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }

        .content {
            max-width: 500px;
        }

        .small {
            color: #aaa;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 45px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        p {
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        button {
            background: white;
            color: black;
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            font-size: 15px;
        }

    </style>
</head>


<body>

    <section class="page">

        <div class="content">

            <div class="small">
                HEY YOU...
            </div>

            <h1>
                I made something<br>
                for you❤️
            </h1>

            <p>
                I don't really know how to explain this...
                so just tap the button.
            </p>

            <button onclick="start()">
                Tap to begin
            </button>

        </div>

    </section>


    <script>

        function start() {

            alert("Okay... here we go❤️");

        }

    </script>

</body>

</html>
